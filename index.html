    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'brand-blue': '#1E4ED8', // 呼应 Logo 深蓝色调

                        'serif': ['"Noto Serif SC"', 'serif'],
                        'sans': ['"Noto Sans SC"', '"Inter"', 'sans-serif'],

                    boxShadow: {
                        'soft': '0 10px 40px -10px rgba(30, 78, 216, 0.08)',

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Noto+Serif+SC:wght@400;600;700&display=swap');
        body { font-family: 'Noto Sans SC', sans-serif; background-color: #F8FAFC; color: #0F172A; }
        h1, h2, h3, .serif-font { font-family: 'Noto Serif SC', serif; }
        .chart-container { position: relative; width: 100%; max-width: 500px; height: 320px; margin: auto; }
        @media (min-width: 768px) { .chart-container { height: 380px; } }
        html { scroll-behavior: smooth; }
        .text-gradient {
            background: linear-gradient(135deg, #1E4ED8 0%, #0EA5E9 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .bg-gradient-premium { background: linear-gradient(135deg, #0F172A 0%, #1E293B 100%); }
        .timeline-line::before {
            content: ''; position: absolute; top: 0; bottom: 0; left: 24px; width: 2px;
            background: linear-gradient(to bottom, #1E4ED8 0%, #0EA5E9 50%, #F59E0B 100%);
            opacity: 0.2; z-index: 0;
        }
        .value-card { transition: all 0.4s ease; }
        .value-card:hover { transform: translateY(-5px); box-shadow: 0 20px 40px -10px rgba(30, 78, 216, 0.12); }
        .value-card:hover .icon-wrapper { background-color: #1E4ED8; color: white; }
    </style>
</head>
